<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente - DaedaloSYS</title>
</head>
<body>
    <h1>Editar Cliente</h1>

    <form action="/clientes/editar/{{ cliente.id }}" method="POST">
        <div>
            <label for="razao_social">Razão Social:</label>
            <input type="text" id="razao_social" name="razao_social" value="{{ cliente.razao_social }}" required>
        </div>
        <div>
            <label for="nome_fantasia">Nome Fantasia:</label>
            <input type="text" id="nome_fantasia" name="nome_fantasia" value="{{ cliente.nome_fantasia }}">
        </div>
        <div>
            <label for="cnpj_cpf">CNPJ/CPF:</label>
            <input type="text" id="cnpj_cpf" name="cnpj_cpf" value="{{ cliente.cnpj_cpf }}" required>
        </div>
        <div>
            <label for="inscricao_estadual">Inscrição Estadual:</label>
            <input type="text" id="inscricao_estadual" name="inscricao_estadual" value="{{ cliente.inscricao_estadual }}">
        </div>
        <div>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" value="{{ cliente.telefone }}">
        </div>
        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" value="{{ cliente.email }}">
        </div>
        <div>
            <label for="logradouro">Logradouro:</label>
            <input type="text" id="logradouro" name="logradouro" value="{{ cliente.logradouro }}">
        </div>
        <div>
            <label for="numero">Número:</label>
            <input type="text" id="numero" name="numero" value="{{ cliente.numero }}">
        </div>
        <div>
            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro" value="{{ cliente.bairro }}">
        </div>
        <div>
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" value="{{ cliente.cidade }}">
        </div>
        <div>
            <label for="uf">UF:</label>
            <input type="text" id="uf" name="uf" maxlength="2" value="{{ cliente.uf }}">
        </div>
        <div>
            <label for="responsavel">Responsável:</label>
            <input type="text" id="responsavel" name="responsavel" value="{{ cliente.responsavel }}">
        </div>
        <div>
            <label for="fornecedor">É fornecedor?</label>
            <input type="checkbox" id="fornecedor" name="fornecedor" value="True" {% if cliente.fornecedor %}checked{% endif %}>
        </div>
        <button type="submit">Salvar Alterações</button>
    </form>
    <br>
    <a href="/clientes/lista">Voltar para a Lista</a>
</body>
</html>
